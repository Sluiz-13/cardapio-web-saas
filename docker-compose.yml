services:
  postgres:
    image: postgres:16-alpine
    container_name: cardapio-web-saas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardapio
      POSTGRES_PASSWORD: cardapio
      POSTGRES_DB: cardapio_web
    ports:
      - "5435:5432"
    volumes:
      - cardapio_web_pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cardapio-web-saas-app
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    volumes:
      - cardapio_web_uploads:/app/public/uploads

volumes:
  cardapio_web_pgdata:
  cardapio_web_uploads: